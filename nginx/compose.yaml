services:
  nginx:
    image: nginx:1.28-alpine
    container_name: proxy-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./snippets:/etc/nginx/snippets:ro
      - ./security:/etc/nginx/security:ro

    networks:
      - my-network

networks:
  my-network:
    external: true
